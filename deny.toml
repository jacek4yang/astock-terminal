[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
# Scoped, justified exceptions. Every entry must name why it is accepted and
# what would remove it. This list is not a place to silence a vulnerability.
#
# RUSTSEC-2025-0075/0080/0081/0098/0100 are `unmaintained` advisories, not
# vulnerabilities: no CVE, no known exploit, and the advisories themselves state
# "No safe upgrade is available!". They cover the `unic-*` family, which enters
# the graph only transitively through the desktop framework:
#
#   unic-char-property / unic-char-range / unic-common / unic-ucd-ident /
#   unic-ucd-version  <-  urlpattern  <-  tauri-utils  <-  tauri, tauri-build,
#                                                          tauri-codegen
#
# Nothing in AStock depends on them directly, and they are not reachable from the
# Agent runtime or the Engine. Removing them requires upstream Tauri to drop
# `urlpattern` or `urlpattern` to drop `unic-*`; neither is in this project's
# control, and pinning around it is not possible because no fixed version exists.
#
# Re-check on every Tauri upgrade and delete entries that no longer apply.
ignore = [
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
git-fetch-with-cli = true

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
