SPECIFICATION ProgressSpec

CONSTANTS
  Tools = {quote, fundamentals}
  MaxRetries = 2
  MaxCrashes = 2
  MaxSeq = 12

INVARIANTS
  TypeOK
  PendingCorrespondence
  ResultUniqueness
  CompletedHasOneResult
  CancellationSafety
  FailureSafety
  ReleaseSafety
  NoUnpublishedCompletion
  RetryBounded

PROPERTIES
  SeqMonotonic
  TerminalAbsorbing
  FiniteRangeLiveness
