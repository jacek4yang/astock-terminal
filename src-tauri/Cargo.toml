[package]
name = "astock-app"
description = "Tauri v2 desktop shell for the A-share AI research terminal"
version.workspace = true
edition.workspace = true
default-run = "astock-app"

[lib]
name = "astock_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
astock-core = { path = "../crates/core" }
astock-agent = { path = "../crates/agent" }
astock-backtest = { path = "../crates/backtest" }
astock-market-data = { path = "../crates/market-data" }
astock-storage = { path = "../crates/storage" }
astock-trading-rules = { path = "../crates/trading-rules" }
astock-technical = { path = "../crates/technical" }
astock-chanlun = { path = "../crates/chanlun" }
astock-fundamental = { path = "../crates/fundamental" }
astock-graph = { path = "../crates/graph" }
astock-minimax = { path = "../crates/minimax" }
astock-news-intelligence = { path = "../crates/news-intelligence" }
astock-entity-linking = { path = "../crates/entity-linking" }
astock-source-verification = { path = "../crates/source-verification" }
astock-disclosure = { path = "../crates/disclosure" }
astock-global-intelligence = { path = "../crates/global-intelligence" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
chrono.workspace = true
futures.workspace = true
tokio-util = "0.7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
# tauri's custom-protocol feature is required for release builds on Windows
custom-protocol = ["tauri/custom-protocol"]
