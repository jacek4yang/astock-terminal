[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/core",
    "crates/trading-rules",
    "crates/market-data",
    "crates/storage",
    "crates/technical",
    "crates/chanlun",
    "crates/minimax",
    "crates/fundamental",
    "crates/graph",
    "crates/quant",
    "crates/backtest",
    "crates/wencai",
    "crates/captcha",
    "crates/tdx",
    "crates/joinquant",
    "crates/security",
    "crates/evaluation",
    "crates/news-intelligence",
    "crates/entity-linking",
    "crates/source-verification",
    "crates/disclosure",
    "crates/global-intelligence",
    "crates/event-intelligence",
    "crates/relation-extraction",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# async runtime & http
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "stream", "socks"] }
futures = "0.3"
async-trait = "0.1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# errors & logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# time
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
arrow = { version = "59.2", features = ["prettyprint"] }
parquet = { version = "59.2", features = ["arrow"] }
# utils
lru = "0.18.2"
parking_lot = "0.12"
dashmap = "6"
governor = "0.8"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.9"
regex = "1"
once_cell = "1"
url = "2"
sha2 = "0.10"
flate2 = "1"
# tests
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
