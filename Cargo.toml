[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/compute",
    "crates/agent-runtime",
    "crates/astock",
    "crates/core",
    "crates/trading-rules",
    "crates/market-data",
    "crates/storage",
    "crates/technical",
    "crates/chanlun",
    "crates/minimax",
    "crates/fundamental",
    "crates/graph",
    "crates/quant",
    "crates/backtest",
    "crates/wencai",
    "crates/captcha",
    "crates/tdx",
    "crates/joinquant",
    "crates/security",
    "crates/evaluation",
    "crates/news-intelligence",
    "crates/entity-linking",
    "crates/source-verification",
    "crates/disclosure",
    "crates/global-intelligence",
    "crates/event-intelligence",
    "crates/relation-extraction",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# async runtime & http
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "stream", "socks"] }
futures = "0.3"
async-trait = "0.1"
tokio-util = "0.7"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.9"
# errors & logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# time
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
arrow = { version = "59.2", features = ["prettyprint"] }
parquet = { version = "59.2", features = ["arrow"] }
# utils
lru = "0.18.2"
parking_lot = "0.12"
dashmap = "6"
governor = "0.8"
# Credential storage. A backend MUST be selected for every supported platform:
# with no platform feature enabled, keyring 3.x silently falls back to an
# in-memory *mock* store, where `store_key` reports success and the value is
# never persisted. Silent credential loss is worse than a visible failure.
#
# linux-native uses the kernel keyutils keyring: pure Rust, no libdbus, works
# headless. It is session/user scoped rather than persistent across reboot;
# cross-reboot persistence needs the Secret Service backend, which pulls in
# libdbus and requires a running gnome-keyring/kwallet daemon. That upgrade is
# tracked separately rather than adopted blind, because it cannot be verified in
# a headless environment.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rand = "0.9"
regex = "1"
once_cell = "1"
url = "2"
sha2 = "0.10"
flate2 = "1"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
rpassword = "7.4"
# tests
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
