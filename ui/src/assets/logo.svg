<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#0f172a"/>
  <!-- 刻度基线 -->
  <path d="M9 37.5h30" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 上升折线(角峰) -->
  <polyline
    points="9,31 16.5,22 22,26.5 30,12 34.5,17 39,9.5"
    fill="none"
    stroke="#e5484d"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- 峰顶箭头感:末段加粗三角 -->
  <path d="M39 9.5l-6.8-.6 3.4 6z" fill="#e5484d"/>
  <!-- 绿色点缀(起涨点) -->
  <circle cx="12" cy="13" r="2" fill="#2eb872"/>
  <circle cx="9" cy="31" r="2.2" fill="#2eb872"/>
</svg>
