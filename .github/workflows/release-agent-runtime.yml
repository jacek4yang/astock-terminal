name: release-agent-runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-agent-runtime.yml
      - .github/release-manifests/v5.0.3-agent-runtime.1.json
      - .github/release-requests/v5.0.3-agent-runtime.1.md
      - docs/releases/v5.0.3-agent-runtime.1.md
      - scripts/release-agent-runtime.ps1
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-manifests/v5.0.3-agent-runtime.1.json
      - .github/release-requests/v5.0.3-agent-runtime.1.md

permissions:
  contents: read

concurrency:
  group: release-v5.0.3-agent-runtime.1
  cancel-in-progress: false

env:
  RELEASE_MANIFEST: .github/release-manifests/v5.0.3-agent-runtime.1.json
  CARGO_TERM_COLOR: always

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      source_commit: ${{ steps.manifest.outputs.source_commit }}
      application_version: ${{ steps.manifest.outputs.application_version }}
      release_notes: ${{ steps.manifest.outputs.release_notes }}
      artifact_name: ${{ steps.manifest.outputs.artifact_name }}
      platform: ${{ steps.manifest.outputs.platform }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: manifest
        name: Validate immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RELEASE_MANIFEST"
          jq -e '
            .schema_version == 1 and
            (.tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-[A-Za-z0-9._-]+$")) and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.application_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            .prerelease == true and
            (.release_notes | type == "string" and length > 0) and
            (.artifact_name | test("^[A-Za-z0-9._-]+$")) and
            .platform == "windows-x86_64"
          ' "$RELEASE_MANIFEST" >/dev/null

          tag="$(jq -r .tag "$RELEASE_MANIFEST")"
          source_commit="$(jq -r .source_commit "$RELEASE_MANIFEST")"
          application_version="$(jq -r .application_version "$RELEASE_MANIFEST")"
          release_notes="$(jq -r .release_notes "$RELEASE_MANIFEST")"
          artifact_name="$(jq -r .artifact_name "$RELEASE_MANIFEST")"
          platform="$(jq -r .platform "$RELEASE_MANIFEST")"
          manifest_sha256="$(sha256sum "$RELEASE_MANIFEST" | awk '{print $1}')"

          case "$release_notes" in
            /*|*..*) echo "release_notes must be a repository-relative safe path" >&2; exit 1 ;;
          esac
          test -f "$release_notes"
          grep -Fq "$tag" "$release_notes"
          grep -Fq "$source_commit" "$release_notes"

          git fetch origin "+refs/heads/main:refs/remotes/origin/main" --force
          git cat-file -e "$source_commit^{commit}"
          git merge-base --is-ancestor "$source_commit" origin/main

          {
            echo "tag=$tag"
            echo "source_commit=$source_commit"
            echo "application_version=$application_version"
            echo "release_notes=$release_notes"
            echo "artifact_name=$artifact_name"
            echo "platform=$platform"
            echo "manifest_sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"

  automation-lint:
    needs: release-metadata
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_TARGET_SHA: ${{ needs.release-metadata.outputs.source_commit }}
      RELEASE_NOTES: ${{ needs.release-metadata.outputs.release_notes }}
      RELEASE_MANIFEST_SHA256: ${{ needs.release-metadata.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse fallback publisher and verify release identity
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/release-agent-runtime.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell fallback publisher has syntax errors"
          }

          $manifest = Get-Content $env:RELEASE_MANIFEST -Raw | ConvertFrom-Json
          if ($manifest.tag -ne $env:RELEASE_TAG) { throw "manifest tag output mismatch" }
          if ($manifest.source_commit -ne $env:RELEASE_TARGET_SHA) { throw "manifest source output mismatch" }
          if ($manifest.release_notes -ne $env:RELEASE_NOTES) { throw "manifest notes output mismatch" }
          $manifestHash = (Get-FileHash $env:RELEASE_MANIFEST -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -ne $env:RELEASE_MANIFEST_SHA256) { throw "manifest hash output mismatch" }

          foreach ($path in @(
            ".github/release-requests/v5.0.3-agent-runtime.1.md",
            $env:RELEASE_NOTES
          )) {
            $document = Get-Content $path -Raw
            if (-not $document.Contains($env:RELEASE_TAG)) {
              throw "$path does not contain $env:RELEASE_TAG"
            }
            if (-not $document.Contains($env:RELEASE_TARGET_SHA)) {
              throw "$path does not contain $env:RELEASE_TARGET_SHA"
            }
          }

          $script = Get-Content "scripts/release-agent-runtime.ps1" -Raw
          if (-not $script.Contains($env:RELEASE_MANIFEST)) {
            throw "fallback publisher does not consume $env:RELEASE_MANIFEST"
          }

  security-audit:
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source_commit }}
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  evaluation-gate:
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic research evaluation gate
        run: >-
          cargo run --locked -p astock-evaluation --bin astock-eval -- evaluate
          --dataset eval/datasets/p0-v1/dataset.json
          --thresholds eval/datasets/p0-v1/thresholds.json
          --baseline eval/baselines/p0-v1-test.json
          --json target/eval-reports/p0-v1-release.json
          --html target/eval-reports/p0-v1-release.html
          --split test --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evaluation-report
          path: target/eval-reports/
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    needs: release-metadata
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_TARGET_SHA: ${{ needs.release-metadata.outputs.source_commit }}
      APPLICATION_VERSION: ${{ needs.release-metadata.outputs.application_version }}
      RELEASE_PLATFORM: ${{ needs.release-metadata.outputs.platform }}
      RELEASE_MANIFEST_SHA256: ${{ needs.release-metadata.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source_commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify immutable source target
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:RELEASE_TARGET_SHA) {
            throw "checked out $actual, expected immutable release target $env:RELEASE_TARGET_SHA"
          }
      - name: Install frontend dependencies
        run: npm ci --prefix ui
      - name: Verify release version contract
        shell: pwsh
        run: |
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content ui/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content ui/package-lock.json -Raw | ConvertFrom-Json
          $cargo = Get-Content Cargo.toml -Raw
          if ($tauri.version -ne $env:APPLICATION_VERSION) {
            throw "tauri version is $($tauri.version), expected $env:APPLICATION_VERSION"
          }
          if ($package.version -ne $tauri.version) { throw "package.json version does not match tauri.conf.json" }
          if ($lock.version -ne $tauri.version -or $lock.packages."".version -ne $tauri.version) {
            throw "package-lock.json version does not match tauri.conf.json"
          }
          $escapedVersion = [regex]::Escape($env:APPLICATION_VERSION)
          if ($cargo -notmatch "(?s)\[workspace\.package\].*?version\s*=\s*`"$escapedVersion`"") {
            throw "Cargo workspace version does not match $env:APPLICATION_VERSION"
          }
          if (-not $env:RELEASE_TAG.StartsWith("v$($tauri.version)-")) {
            throw "release tag $env:RELEASE_TAG is not a prerelease of v$($tauri.version)"
          }
      - name: Build frontend required by Tauri compile-time checks
        run: npm run build --prefix ui
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust workspace tests
        run: cargo test --workspace --locked
      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check desktop application
        run: cargo check -p astock-app --locked
      - name: Run frontend tests
        run: npm test --prefix ui
      - name: Build MSI and NSIS installers
        shell: pwsh
        run: .\ui\node_modules\.bin\tauri.cmd build
      - name: Ensure dependency lockfiles are unchanged
        run: git diff --exit-code -- Cargo.lock ui/package-lock.json
      - name: Collect installers and generate SHA256SUMS
        shell: pwsh
        run: |
          $roots = @("target/release/bundle", "src-tauri/target/release/bundle") |
            Where-Object { Test-Path $_ }
          if ($roots.Count -eq 0) { throw "Tauri bundle directory was not generated" }

          $files = Get-ChildItem -Path $roots -Recurse -File
          $msi = $files | Where-Object { $_.Extension -eq ".msi" } | Select-Object -First 1
          $setup = $files | Where-Object { $_.Extension -eq ".exe" -and $_.Name -match "setup" } |
            Select-Object -First 1
          if ($null -eq $msi) { throw "MSI installer was not generated" }
          if ($null -eq $setup) { throw "NSIS setup executable was not generated" }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $version = $env:RELEASE_TAG.Substring(1)
          Copy-Item $msi.FullName "dist/astock-terminal-$version-windows-x86_64.msi" -Force
          Copy-Item $setup.FullName "dist/astock-terminal-$version-windows-x86_64-setup.exe" -Force
          @(
            "release_tag=$env:RELEASE_TAG",
            "source_commit=$env:RELEASE_TARGET_SHA",
            "application_version=$env:APPLICATION_VERSION",
            "platform=$env:RELEASE_PLATFORM",
            "release_manifest_sha256=$env:RELEASE_MANIFEST_SHA256"
          ) | Set-Content dist/BUILD-METADATA.txt -Encoding ascii

          Get-ChildItem dist -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.release-metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - release-metadata
      - automation-lint
      - security-audit
      - evaluation-gate
      - windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_TARGET_SHA: ${{ needs.release-metadata.outputs.source_commit }}
      RELEASE_NOTES: ${{ needs.release-metadata.outputs.release_notes }}
      RELEASE_ARTIFACT: ${{ needs.release-metadata.outputs.artifact_name }}
      APPLICATION_VERSION: ${{ needs.release-metadata.outputs.application_version }}
      RELEASE_PLATFORM: ${{ needs.release-metadata.outputs.platform }}
      RELEASE_MANIFEST_SHA256: ${{ needs.release-metadata.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-metadata.outputs.artifact_name }}
          path: dist
      - name: Verify immutable release target and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RELEASE_MANIFEST"
          test -f "$RELEASE_NOTES"
          test -f dist/SHA256SUMS
          test -f dist/BUILD-METADATA.txt
          actual_manifest_sha256="$(sha256sum "$RELEASE_MANIFEST" | awk '{print $1}')"
          test "$actual_manifest_sha256" = "$RELEASE_MANIFEST_SHA256"
          sed -i 's/\r$//' dist/SHA256SUMS dist/BUILD-METADATA.txt
          grep -Fx "release_tag=$RELEASE_TAG" dist/BUILD-METADATA.txt
          grep -Fx "source_commit=$RELEASE_TARGET_SHA" dist/BUILD-METADATA.txt
          grep -Fx "application_version=$APPLICATION_VERSION" dist/BUILD-METADATA.txt
          grep -Fx "platform=$RELEASE_PLATFORM" dist/BUILD-METADATA.txt
          grep -Fx "release_manifest_sha256=$RELEASE_MANIFEST_SHA256" dist/BUILD-METADATA.txt
          (cd dist && sha256sum --check SHA256SUMS)

          git fetch origin "+refs/heads/main:refs/remotes/origin/main" --force
          git fetch --tags --force
          git cat-file -e "$RELEASE_TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_TARGET_SHA" origin/main
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            existing="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$existing" != "$RELEASE_TARGET_SHA" ]]; then
              echo "tag $RELEASE_TAG already points to $existing, expected $RELEASE_TARGET_SHA" >&2
              exit 1
            fi
          fi
      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "AStock Terminal $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease \
              --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$RELEASE_TARGET_SHA" \
              --title "AStock Terminal $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          fi
