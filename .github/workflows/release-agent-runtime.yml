name: release-agent-runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-agent-runtime.yml
      - .github/release-requests/v5.0.3-agent-runtime.1.md
      - docs/releases/v5.0.3-agent-runtime.1.md
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-requests/v5.0.3-agent-runtime.1.md

permissions:
  contents: read

concurrency:
  group: release-v5.0.3-agent-runtime.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v5.0.3-agent-runtime.1
  RELEASE_NOTES: docs/releases/v5.0.3-agent-runtime.1.md
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic research evaluation gate
        run: >-
          cargo run --locked -p astock-evaluation --bin astock-eval -- evaluate
          --dataset eval/datasets/p0-v1/dataset.json
          --thresholds eval/datasets/p0-v1/thresholds.json
          --baseline eval/baselines/p0-v1-test.json
          --json target/eval-reports/p0-v1-release.json
          --html target/eval-reports/p0-v1-release.html
          --split test --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evaluation-report
          path: target/eval-reports/
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix ui
      - name: Verify release version contract
        shell: pwsh
        run: |
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content ui/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content ui/package-lock.json -Raw | ConvertFrom-Json
          $cargo = Get-Content Cargo.toml -Raw
          if ($tauri.version -ne "5.0.3") { throw "tauri version is $($tauri.version), expected 5.0.3" }
          if ($package.version -ne $tauri.version) { throw "package.json version does not match tauri.conf.json" }
          if ($lock.version -ne $tauri.version -or $lock.packages."".version -ne $tauri.version) {
            throw "package-lock.json version does not match tauri.conf.json"
          }
          if ($cargo -notmatch '(?s)\[workspace\.package\].*?version\s*=\s*"5\.0\.3"') {
            throw "Cargo workspace version does not match 5.0.3"
          }
          if (-not $env:RELEASE_TAG.StartsWith("v$($tauri.version)-")) {
            throw "release tag $env:RELEASE_TAG is not a prerelease of v$($tauri.version)"
          }
      - name: Build frontend required by Tauri compile-time checks
        run: npm run build --prefix ui
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check desktop application
        run: cargo check -p astock-app
      - name: Run frontend tests
        run: npm test --prefix ui
      - name: Ensure dependency lockfiles are unchanged
        run: git diff --exit-code -- Cargo.lock ui/package-lock.json
      - name: Build MSI and NSIS installers
        shell: pwsh
        run: .\ui\node_modules\.bin\tauri.cmd build
      - name: Collect installers and generate SHA256SUMS
        shell: pwsh
        run: |
          $roots = @("target/release/bundle", "src-tauri/target/release/bundle") |
            Where-Object { Test-Path $_ }
          if ($roots.Count -eq 0) { throw "Tauri bundle directory was not generated" }

          $files = Get-ChildItem -Path $roots -Recurse -File
          $msi = $files | Where-Object { $_.Extension -eq ".msi" } | Select-Object -First 1
          $setup = $files | Where-Object { $_.Extension -eq ".exe" -and $_.Name -match "setup" } |
            Select-Object -First 1
          if ($null -eq $msi) { throw "MSI installer was not generated" }
          if ($null -eq $setup) { throw "NSIS setup executable was not generated" }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $version = $env:RELEASE_TAG.Substring(1)
          Copy-Item $msi.FullName "dist/astock-terminal-$version-windows-x86_64.msi" -Force
          Copy-Item $setup.FullName "dist/astock-terminal-$version-windows-x86_64-setup.exe" -Force

          Get-ChildItem dist -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: astock-terminal-v5.0.3-agent-runtime.1-windows-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - security-audit
      - evaluation-gate
      - windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: astock-terminal-v5.0.3-agent-runtime.1-windows-x86_64
          path: dist
      - name: Verify release target and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RELEASE_NOTES"
          test -f dist/SHA256SUMS
          sed -i 's/\r$//' dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            existing="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "tag $RELEASE_TAG already points to $existing, expected $GITHUB_SHA" >&2
              exit 1
            fi
          fi
      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "AStock Terminal $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease \
              --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "AStock Terminal $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          fi
