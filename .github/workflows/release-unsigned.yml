name: release-unsigned-attested

on:
  push:
    tags: [v6.0.0]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit, or existing immutable release tag to build
        required: true
        default: codex/v6-production
      publish:
        description: Publish the existing immutable v6.0.0 tag after building
        required: true
        type: boolean
        default: false

concurrency:
  group: release-v6.0.0
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-unsigned-attested:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Configure runner-local build roots
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'astock-build'
          "ASTOCK_BUILD_ROOT=$buildRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$(Join-Path $buildRoot 'cargo-target')" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOONBIT_INSTALL_ROOT=$(Join-Path $buildRoot 'moonbit-toolchain-0.1.20260824-dae026a')" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify public repository and requested release source
        shell: pwsh
        run: |
          git fetch origin main --tags
          $commit = (git rev-parse HEAD).Trim()
          $repo = gh repo view --json visibility,defaultBranchRef | ConvertFrom-Json
          if ($repo.visibility -ne 'PUBLIC' -or $repo.defaultBranchRef.name -ne 'main') {
            throw 'Unsigned OIDC-attested publication requires a public repository with main as default.'
          }
          if ($commit -notmatch '^[a-f0-9]{40}$') { throw 'Could not resolve an immutable source commit.' }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            if ($env:RELEASE_REF -ne 'v6.0.0') { throw "Publication requires v6.0.0, got: $env:RELEASE_REF" }
            $main = (git rev-parse origin/main).Trim()
            $tagCommit = (git rev-list -n 1 v6.0.0).Trim()
            if ($commit -ne $main -or $commit -ne $tagCommit) {
              throw 'v6.0.0 must point to the exact immutable origin/main commit.'
            }
          } else {
            Write-Host "Dry run: building and attesting $commit without creating a GitHub Release."
          }
          "ASTOCK_RELEASE_COMMIT=$commit" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require successful quality checks for the tagged commit
        shell: pwsh
        run: |
          $required = @('architecture-contracts','security-audit','evaluation-gate','frontend','moonbit-agent','rust-windows')
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:ASTOCK_RELEASE_COMMIT/check-runs?per_page=100" | ConvertFrom-Json
            $missing = @($required | Where-Object {
              $name = $_
              -not @($response.check_runs | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' }).Count
            })
            if ($missing.Count -eq 0) { break }
            if ($attempt -eq 119) { throw "Required quality checks did not pass: $($missing -join ', ')" }
            Start-Sleep -Seconds 15
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust 1.89.0
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0
          rustc --version

      - name: Install pinned MoonBit toolchain
        shell: pwsh
        run: .\scripts\install-moonbit-ci.ps1 -InstallRoot $env:MOONBIT_INSTALL_ROOT

      - name: Restore MoonBit registry dependencies
        shell: pwsh
        run: |
          moon -C app-moon update
          moon -C desktop-moon/backend update
          moon -C packaging-moon update

      - name: Install renderer dependencies
        shell: pwsh
        run: npm --prefix ui ci

      - name: Install NSIS and 7-Zip
        shell: pwsh
        run: choco install nsis 7zip --yes --no-progress

      - name: Bootstrap Proton 0.2.1 and pinned CEF
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -SkipSpaceCheck -SkipGitleaks

      - name: Build and package unsigned Windows artifacts
        shell: pwsh
        run: .\scripts\package.ps1 -SkipSpaceCheck

      - name: Generate CycloneDX SBOM for packaged application
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ env.ASTOCK_BUILD_ROOT }}\artifacts\astock-terminal
          format: cyclonedx-json
          output-file: ${{ env.ASTOCK_BUILD_ROOT }}\artifacts\AStock-Terminal-v6.0.0.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Stage immutable unsigned release assets
        id: stage
        shell: pwsh
        run: >-
          .\scripts\stage-unsigned-release.ps1
          -ExpectedCommit $env:ASTOCK_RELEASE_COMMIT
          -SbomPath "$env:ASTOCK_BUILD_ROOT\artifacts\AStock-Terminal-v6.0.0.cdx.json"
          -SkipSpaceCheck

      - name: Generate GitHub build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.stage.outputs.publish_stage }}\*

      - name: Generate SBOM attestation for portable application
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.stage.outputs.publish_stage }}\AStock-Terminal-v6.0.0-windows-x64.zip
          sbom-path: ${{ steps.stage.outputs.publish_stage }}\AStock-Terminal-v6.0.0.cdx.json

      - name: Upload dry-run package for inspection
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6.0.0-unsigned-attested-dry-run-${{ env.ASTOCK_RELEASE_COMMIT }}
          path: ${{ steps.stage.outputs.publish_stage }}\*
          if-no-files-found: error
          retention-days: 7

      - name: Publish Latest GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        shell: pwsh
        run: |
          gh release view v6.0.0 --json id *> $null
          if ($LASTEXITCODE -eq 0) { throw 'GitHub Release already exists: v6.0.0' }
          $assets = @(Get-ChildItem -LiteralPath '${{ steps.stage.outputs.publish_stage }}' -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -lt 6) { throw 'Unsigned release staging is incomplete.' }
          gh release create v6.0.0 --verify-tag --latest --title 'AStock Terminal v6.0.0' --notes-file docs/releases/v6.0.0.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          gh release view v6.0.0 --json url,tagName,isDraft,isPrerelease
