name: publish-v6-recovery

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful release-unsigned-attested dry-run containing the immutable v6 assets
        required: true
        default: "32821875148"

concurrency:
  group: release-v6.0.0
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  publish-attested-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      RELEASE_TAG: v6.0.0
      EXPECTED_WORKFLOW: release-unsigned-attested
      EXPECTED_SIGNER: jacek4yang/astock-terminal/.github/workflows/release-unsigned.yml
    steps:
      - name: Check out immutable v6 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v6.0.0
          fetch-depth: 0

      - name: Verify source run and immutable tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --tags
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagCommit -notmatch '^[a-f0-9]{40}$') {
            throw 'Could not resolve the immutable v6.0.0 tag.'
          }

          $repo = gh repo view --json visibility,defaultBranchRef | ConvertFrom-Json
          if ($repo.visibility -ne 'PUBLIC' -or $repo.defaultBranchRef.name -ne 'main') {
            throw 'Recovery publication requires a public repository with main as default.'
          }

          $run = gh run view $env:SOURCE_RUN --json conclusion,event,headSha,name,url | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch') {
            throw 'The selected source run is not a successful workflow_dispatch dry-run.'
          }
          if ($run.name -ne $env:EXPECTED_WORKFLOW -or $run.headSha -ne $tagCommit) {
            throw 'The selected source run does not match the immutable v6.0.0 source.'
          }

          $assetDir = Join-Path $env:RUNNER_TEMP 'v6-release-assets'
          "ASTOCK_RELEASE_COMMIT=$tagCommit" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASTOCK_RELEASE_ASSET_DIR=$assetDir" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Recovering attested assets from $($run.url) at $tagCommit"

      - name: Download successful attested dry-run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = "v6.0.0-unsigned-attested-dry-run-$env:ASTOCK_RELEASE_COMMIT"
          gh run download $env:SOURCE_RUN --name $artifact --dir $env:ASTOCK_RELEASE_ASSET_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the attested dry-run artifact.' }

      - name: Verify release assets, hashes, policy and attestations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'AStock-Terminal-v6.0.0-build-metadata.json',
            'AStock-Terminal-v6.0.0-migration.md',
            'AStock-Terminal-v6.0.0-SHA256SUMS.txt',
            'AStock-Terminal-v6.0.0-UNSIGNED-NOTICE.txt',
            'AStock-Terminal-v6.0.0-verification.json',
            'AStock-Terminal-v6.0.0-windows-x64-setup.exe',
            'AStock-Terminal-v6.0.0-windows-x64.zip',
            'AStock-Terminal-v6.0.0.cdx.json'
          )
          $files = @(Get-ChildItem -LiteralPath $env:ASTOCK_RELEASE_ASSET_DIR -File)
          $actual = @($files.Name | Sort-Object)
          $wanted = @($expected | Sort-Object)
          if ((Compare-Object $wanted $actual).Count -ne 0) {
            throw "Recovered asset set is not exact: $($actual -join ', ')"
          }

          $manifest = Join-Path $env:ASTOCK_RELEASE_ASSET_DIR 'AStock-Terminal-v6.0.0-SHA256SUMS.txt'
          $entries = @(Get-Content -LiteralPath $manifest | Where-Object { $_.Trim() })
          if ($entries.Count -ne 7) { throw "Expected 7 SHA-256 entries, got $($entries.Count)." }
          foreach ($line in $entries) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Invalid SHA-256 entry: $line" }
            $target = Join-Path $env:ASTOCK_RELEASE_ASSET_DIR $Matches[2]
            $actualHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $Matches[1]) { throw "SHA-256 mismatch: $($Matches[2])" }
          }

          $metadata = Get-Content -LiteralPath (Join-Path $env:ASTOCK_RELEASE_ASSET_DIR 'AStock-Terminal-v6.0.0-build-metadata.json') -Raw | ConvertFrom-Json
          $verification = Get-Content -LiteralPath (Join-Path $env:ASTOCK_RELEASE_ASSET_DIR 'AStock-Terminal-v6.0.0-verification.json') -Raw | ConvertFrom-Json
          $sbom = Get-Content -LiteralPath (Join-Path $env:ASTOCK_RELEASE_ASSET_DIR 'AStock-Terminal-v6.0.0.cdx.json') -Raw | ConvertFrom-Json
          if ($metadata.commit -ne $env:ASTOCK_RELEASE_COMMIT -or $verification.commit -ne $env:ASTOCK_RELEASE_COMMIT) {
            throw 'Release metadata does not match the immutable tag commit.'
          }
          if ($verification.distribution.authenticode -ne 'NOT PROVIDED' -or
              $verification.distribution.mode -ne 'github-oidc-attested-unsigned' -or
              $verification.release_safety.credentials_embedded -ne $false -or
              $verification.release_safety.automatic_trading -ne $false -or
              $verification.release_safety.human_review_required -ne $true) {
            throw 'Unsigned release safety metadata is invalid.'
          }
          if ($sbom.bomFormat -ne 'CycloneDX' -or $sbom.specVersion -ne '1.6') {
            throw 'CycloneDX 1.6 SBOM is missing or invalid.'
          }

          foreach ($file in $files) {
            gh attestation verify $file.FullName -R $env:GITHUB_REPOSITORY `
              --signer-workflow $env:EXPECTED_SIGNER `
              --source-digest $env:ASTOCK_RELEASE_COMMIT `
              --deny-self-hosted-runners *> $null
            if ($LASTEXITCODE -ne 0) { throw "Build provenance failed: $($file.Name)" }
          }
          $portable = Join-Path $env:ASTOCK_RELEASE_ASSET_DIR 'AStock-Terminal-v6.0.0-windows-x64.zip'
          gh attestation verify $portable -R $env:GITHUB_REPOSITORY `
            --signer-workflow $env:EXPECTED_SIGNER `
            --source-digest $env:ASTOCK_RELEASE_COMMIT `
            --deny-self-hosted-runners `
            --predicate-type 'https://cyclonedx.org/bom' *> $null
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX SBOM attestation failed.' }

      - name: Complete draft and publish Latest release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(Get-ChildItem -LiteralPath $env:ASTOCK_RELEASE_ASSET_DIR -File | Sort-Object Name)
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title 'AStock Terminal v6.0.0' --notes-file docs/releases/v6.0.0.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the recovery draft release.' }
            $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -ne $true -or $release.isPrerelease -ne $false) {
            throw 'Recovery can only complete an unpublished v6.0.0 draft.'
          }

          $expectedNames = @($expected.Name)
          foreach ($asset in @($release.assets)) {
            if ($expectedNames -notcontains $asset.name) { throw "Unexpected draft asset: $($asset.name)" }
            $local = Join-Path $env:ASTOCK_RELEASE_ASSET_DIR $asset.name
            $localDigest = 'sha256:' + (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -ne $localDigest) { throw "Existing draft asset digest mismatch: $($asset.name)" }
          }

          $present = @($release.assets.name)
          foreach ($asset in $expected) {
            if ($present -notcontains $asset.Name) {
              gh release upload $env:RELEASE_TAG $asset.FullName
              if ($LASTEXITCODE -ne 0) { throw "Could not upload release asset: $($asset.Name)" }
            }
          }

          $complete = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if (@($complete.assets).Count -ne $expected.Count) { throw 'The completed draft does not contain exactly 8 assets.' }
          foreach ($asset in @($complete.assets)) {
            $local = Join-Path $env:ASTOCK_RELEASE_ASSET_DIR $asset.name
            if (-not (Test-Path -LiteralPath $local -PathType Leaf)) { throw "Unexpected uploaded asset: $($asset.name)" }
            $localDigest = 'sha256:' + (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -ne $localDigest -or $asset.state -ne 'uploaded') {
              throw "Uploaded asset verification failed: $($asset.name)"
            }
          }

          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest --title 'AStock Terminal v6.0.0' --notes-file docs/releases/v6.0.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed v6.0.0 release.' }
          $published = gh release view $env:RELEASE_TAG --json url,tagName,isDraft,isPrerelease | ConvertFrom-Json
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($published.isDraft -or $published.isPrerelease -or $latest.tag_name -ne $env:RELEASE_TAG) {
            throw 'v6.0.0 was not published as the Latest stable release.'
          }
          $published | ConvertTo-Json
