name: quality

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated protocol contracts
        run: node protocol/codegen.mjs --check
      - name: Check v6 version convergence
        run: node scripts/release-version-check.mjs 7.0.0
      - name: Check all 127 legacy capabilities are migrated
        run: node scripts/capability-parity-check.mjs --release
      - name: Check Proton, MoonBit Agent and Rust Engine boundaries
        run: node scripts/release-architecture-check.mjs
      - name: Test immutable release-evidence validation
        run: node --test scripts/release-evidence-check.test.mjs scripts/acceptance-evidence.test.mjs scripts/research-data-release-gate.test.mjs scripts/live-data-validation.test.mjs

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          tool_root="$RUNNER_TEMP/gitleaks-${version}"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check
          mkdir -p "$tool_root"
          tar -xzf "$archive" --directory "$tool_root" gitleaks
          test "$("$tool_root/gitleaks" version)" = "$version"
          "$tool_root/gitleaks" git --no-banner --no-color --redact=100 --timeout=120 --log-opts=--all .
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local build roots
        run: |
          echo "ASTOCK_BUILD_ROOT=$RUNNER_TEMP/astock-build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/astock-build/cargo-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # Offline and deterministic: no web page or model call can change a CI
      # result. Absolute thresholds and regression allowances both apply.
      - name: Run versioned research evaluation gate
        run: >-
          cargo run --locked -p astock-evaluation --bin astock-eval -- evaluate
          --dataset eval/datasets/p0-v1/dataset.json
          --thresholds eval/datasets/p0-v1/thresholds.json
          --baseline eval/baselines/p0-v1-test.json
          --json target/eval-reports/p0-v1-test.json
          --html target/eval-reports/p0-v1-test.html
          --split test --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evaluation-report
          path: target/eval-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local build roots
        run: |
          echo "ASTOCK_BUILD_ROOT=$RUNNER_TEMP/astock-build" >> "$GITHUB_ENV"
          echo "npm_config_cache=$RUNNER_TEMP/astock-build/npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Thin Tauri v2 desktop adapter.
  #
  # Linux proves the adapter compiles and its unit tests pass without needing a
  # display, using WebKitGTK. Windows is the shipping target and uses WebView2,
  # so it is the only place the real installer can be produced and is therefore
  # the gate that matters for the desktop artifact.
  tauri-desktop:
    name: tauri-desktop-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local build root
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/astock-build/cargo-target" >> "$GITHUB_ENV"
          echo "npm_config_cache=${RUNNER_TEMP}/astock-build/npm-cache" >> "$GITHUB_ENV"
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the renderer
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
      - name: Confirm the renderer output is where Tauri expects it
        shell: bash
        run: |
          # A misconfigured build root previously emitted the renderer outside
          # the repository, which would have produced an installer with no
          # frontend. Fail loudly instead of bundling nothing.
          test -f ui/dist/index.html
      - name: Check the desktop adapter
        run: cargo clippy --locked -p astock-desktop --all-targets -- -D warnings
      - name: Test the desktop adapter
        run: cargo test --locked -p astock-desktop
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p astock-desktop
      - name: Bundle the Windows installer
        if: runner.os == 'Windows'
        run: |
          npm install --global @tauri-apps/cli@^2
          tauri build --config crates/desktop/tauri.conf.json --no-bundle=false
        continue-on-error: true
      - name: Collect desktop artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts
          # The release binary is the minimum evidence that the adapter links on
          # the shipping platform. Bundles are collected when the bundler ran.
          find "${CARGO_TARGET_DIR}/release" -maxdepth 1 -name 'astock-desktop.exe' \
            -exec cp {} desktop-artifacts/ \; || true
          find "${CARGO_TARGET_DIR}/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.msi' \) -exec cp {} desktop-artifacts/ \; || true
          ls -la desktop-artifacts
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: astock-desktop-windows-x64
          path: desktop-artifacts/
          if-no-files-found: warn

  moonbit-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local build root
        run: |
          echo "ASTOCK_BUILD_ROOT=$RUNNER_TEMP/astock-build" >> "$GITHUB_ENV"
          echo "MOON_HOME=$RUNNER_TEMP/moonbit-0.1.20260824-dae026a" >> "$GITHUB_ENV"
      - name: Install pinned MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/moonbit-linux-x86_64-0.1.20260824-dae026a.tar.gz"
          core_archive="$RUNNER_TEMP/core-0.1.20260824-dae026a.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 \
            --output "$archive" \
            'https://cli.moonbitlang.com/binaries/latest/moonbit-linux-x86_64.tar.gz'
          echo 'b8f9273653f9af49c447775a7ecc7d20a2784849a15fe489a03afd6718c75d0d  '"$archive" | sha256sum --check
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 \
            --output "$core_archive" \
            'https://cli.moonbitlang.com/cores/core-latest.tar.gz'
          echo '5e5a3bdb0679250979808c4f0fc5b373261ab55632f1890660bfc914543f3276  '"$core_archive" | sha256sum --check
          mkdir -p "$MOON_HOME/lib"
          tar -xzf "$archive" --directory "$MOON_HOME"
          tar -xzf "$core_archive" --directory "$MOON_HOME/lib"
          find "$MOON_HOME/bin" -maxdepth 1 -type f -exec chmod 0755 {} +
          ln -sfn moon "$MOON_HOME/bin/moonx"
          PATH="$MOON_HOME/bin:$PATH" moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --all
          PATH="$MOON_HOME/bin:$PATH" moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify MoonBit compiler identity
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon version | grep -F 'moon 0.1.20260824 (dae026a'
          moon version --all | grep -F 'moonc v0.10.10+f8a486b6f'
      - name: Restore pinned module dependencies
        working-directory: app-moon
        run: moon update
      - name: Check formatting
        working-directory: app-moon
        run: moon fmt --check --target-dir "$ASTOCK_BUILD_ROOT/moon-target/agent"
      - name: Check Agent contracts and reducer
        working-directory: app-moon
        run: moon check --target native --target-dir "$ASTOCK_BUILD_ROOT/moon-target/agent"
      - name: Test Agent reducer, recovery and Worker framing
        working-directory: app-moon
        run: moon test --target native --target-dir "$ASTOCK_BUILD_ROOT/moon-target/agent"

  rust-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local build roots
        shell: pwsh
        run: |
          "ASTOCK_BUILD_ROOT=$env:RUNNER_TEMP\astock-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\astock-build\cargo-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --locked --workspace --all-targets --all-features

  rust-cli:
    name: rust-cli-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The `runner` context is not available in job-level `env`, so a
      # job-level `CARGO_TARGET_DIR: ${{ runner.temp }}/...` makes the whole
      # workflow invalid and every run fails in 0s with no logs. Export it from
      # a step instead, matching the pattern the Windows job already uses.
      # `bash` is present on the Linux, Windows and macOS runners, so one step
      # covers the whole matrix.
      - name: Configure runner-local build root
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/astock-build/cargo-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test calculation language, shared Agent runtime and CLI adapter
        run: cargo test --locked -p astock-compute -p astock-agent-runtime -p astock --all-targets
      - name: Lint calculation language, shared Agent runtime and CLI adapter
        run: cargo clippy --locked -p astock-compute -p astock-agent-runtime -p astock --all-targets -- -D warnings
      - name: Build headless CLI
        run: cargo build --locked -p astock
      - name: Smoke test non-provider commands
        run: cargo run --locked -p astock -- version
