name: agent-hardening-bootstrap

on:
  push:
    branches: [fix/agent-runtime-hardening]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-runtime-hardening
          fetch-depth: 0
      - name: Verify branch write access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f agent-hardening-action-probe.txt ]]; then
            echo "probe already completed"
            exit 0
          fi
          printf 'GitHub Actions branch write probe completed at %s\n' "$(date -u +%FT%TZ)" > agent-hardening-action-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-hardening-action-probe.txt
          git commit -m "chore: verify agent hardening automation [skip ci]"
          git push
