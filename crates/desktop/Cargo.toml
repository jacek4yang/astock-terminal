[package]
name = "astock-desktop"
description = "Thin Tauri v2 desktop adapter over the shared AStock Agent Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The adapter is presentation and OS integration only. It depends on the shared
# runtime, the Engine boundary and the protocol envelope, and deliberately on no
# domain crate: financial capability is reached through the Engine so there is
# exactly one production Agent implementation. `tests/architecture.rs` in
# astock-agent-runtime enforces this.
[dependencies]
astock-agent-runtime = { version = "7.0.0", path = "../agent-runtime" }
astock-engine = { version = "7.0.0", path = "../engine" }
astock-minimax = { version = "7.0.0", path = "../minimax" }
astock-protocol = { version = "7.0.0", path = "../protocol" }
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "astock-desktop"
path = "src/main.rs"
